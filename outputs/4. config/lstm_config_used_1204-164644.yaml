data:
  downsample_factor: 4
  examples: valid_examples_listseq.csv
  labels: valid_labels_listseq.csv
  scale_inputs: true
  scale_labels: true
model:
  dropout: 0.2
  hidden_size: 128
  num_layers: 2
  type: lstm
paths:
  save_dir: outputs
print:
  verbose: true
training:
  batch_size: 8
  epochs: 100
  grad_clip: 1.0
  lr: 0.0005
  seed: 42
  shuffle: true
  val_split: 0.2
