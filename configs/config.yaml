data:
  examples: "valid_examples_listseq.csv"
  labels: "valid_labels_listseq.csv"
  scale_labels: true
  scale_inputs: true
  downsample_factor: 4

training:
  epochs: 100
  batch_size: 8
  lr: 0.0005
  seed: 42
  val_split: 0.2
  shuffle: true
  grad_clip: 1.0

model:
  type: "lstm"
  hidden_size: 512
  num_layers: 3
  dropout: 0.2

paths:
  save_dir: "outputs"

print:
  verbose: true
