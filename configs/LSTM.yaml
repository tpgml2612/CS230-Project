data:
  examples: "valid_examples_listseq.csv"
  labels: "valid_labels_listseq.csv"
  scale_labels: true

preprocessing:
  window_size: 10
  step_size: 10
  use_scalar: true

training:
  epochs: 100
  batch_size: 8
  lr: 0.0003
  seed: 42
  shuffle: true

model:
  type: "lstm"
  hidden_dim: 32
  num_layers: 1
  dropout: 0.3
  bidirectional: false

paths:
  save_dir: "outputs"

print:
  verbose: true
