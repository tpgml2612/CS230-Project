data:
  examples: "valid_examples_listseq.csv"
  labels: "valid_labels_listseq.csv"
  scale_labels: true

preprocessing:
  window_size: 20
  step_size: 10
  use_scalar: true

training:
  epochs: 100
  batch_size: 8
  lr: 0.0003
  seed: 42

model:
  type: "window_lstm"
  hidden_dim: 64
  dropout: 0.0

paths:
  save_dir: "outputs"

print:
  verbose: true